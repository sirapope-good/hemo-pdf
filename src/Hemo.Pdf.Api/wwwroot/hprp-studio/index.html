<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPRP Studio — Table Designer</title>
  <link rel="stylesheet" href="/hprp-studio/studio.css" />
</head>
<body class="mode-designer mode-wysiwyg">
  <header class="top">
    <div>
      <h1>HPRP Studio</h1>
      <p class="muted">ลาก block วางข้าง/ล่าง · ลากขอบย่อขยาย · Page = margin/ขอบ · Download PDF = verify</p>
    </div>
    <div class="top-right">
      <div class="mode-toggle" role="group" aria-label="Editor mode">
        <button type="button" id="btnModeDesigner" class="active">Canvas</button>
        <button type="button" id="btnModeJson">JSON</button>
      </div>
      <div class="auth">
        <label>Bearer <input id="token" type="text" value="dev" autocomplete="off" /></label>
        <label>Tenant <input id="tenant" type="text" value="local" autocomplete="off" /></label>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="pane packages">
      <div class="pane-head">
        <strong>Packages</strong>
        <button id="btnReload" type="button">Reload</button>
      </div>
      <div class="actions package-actions">
        <button id="btnPackAll" type="button" title="Read every report folder and write packages/*.hprp">Pack all from disk</button>
        <input type="file" id="fileImportHprp" accept=".hprp,.zip" class="hidden" />
        <button id="btnImport" type="button" title="Load a .hprp into the editor (validate first)">Import .hprp</button>
        <button id="btnExport" type="button" disabled title="Download draft as .hprp after validate">Export .hprp</button>
      </div>
      <ul id="packageList" class="list"></ul>
    </aside>

    <section class="pane designer-col" id="designerPane">
      <div class="pane-head">
        <strong id="editorTitle">No package selected</strong>
        <div class="actions">
          <button id="btnValidate" type="button" disabled>Validate</button>
          <button id="btnPackThis" class="primary" type="button" disabled title="Overwrite this .hprp from assets/templates/reports/{id}">Pack this from disk</button>
          <button id="btnSave" type="button" disabled title="Write the editor JSON to packages/*.hprp">Save and pack</button>
        </div>
      </div>
      <div id="denseFormHint" class="dense-hint hidden" role="note"></div>
      <div class="designer-split designer-only" id="designerStudioPane">
        <div class="subpane page-canvas-pane designer-canvas-pane">
          <div class="subhead">Page canvas (WYSIWYG)</div>
          <div class="designer-canvas-toolbar-host">
            <label class="preview-opt">Sample
              <select id="designerSampleScenario" title="Mock payload scenario">
                <option value="">default</option>
              </select>
            </label>
            <button id="btnAddConfigTable" type="button" title="Add configurable table">+ Table</button>
            <button id="btnDesignerDownloadPdf" type="button" disabled title="QuestPDF verify">Download PDF</button>
          </div>
          <div id="designerCanvas" class="page-canvas-scroll" aria-label="Designer WYSIWYG canvas"></div>
        </div>
      </div>
      <!-- Legacy DOM hooks kept hidden so studio.js does not throw; not shown in Canvas mode -->
      <div class="hidden" aria-hidden="true">
        <div id="palette"></div>
        <ul id="bodyList"></ul>
        <div id="pageCanvas"></div>
        <div id="absolutePalette"></div>
        <div id="absoluteSheet"></div>
        <select id="sampleScenario"><option value="">default</option></select>
        <input id="previewEntityId" type="text" />
        <button id="btnPreview" type="button"></button>
        <button id="btnDownloadPdf" type="button"></button>
        <iframe id="previewFrame" src="about:blank" title="unused"></iframe>
      </div>
    </section>

    <section class="pane inspector-col" id="inspectorPane">
      <div class="pane-head">
        <strong>Inspector</strong>
        <div class="actions">
          <button id="btnPage" type="button">Page</button>
          <button id="btnLabels" type="button" disabled title="Edit labels dictionary for current language">Labels</button>
        </div>
      </div>
      <div id="inspector" class="inspector"><p class="muted">เปิด package แล้วคลิกตารางบน canvas เพื่อแก้คอลัมน์ / row mode / field map</p></div>
    </section>

    <section class="pane editor json-col" id="jsonPane">
      <div class="pane-head">
        <strong>Advanced JSON</strong>
        <div class="actions">
          <button id="btnValidateJson" type="button" disabled>Validate</button>
          <button id="btnPackThisJson" class="primary" type="button" disabled>Pack this from disk</button>
          <button id="btnSaveJson" type="button" disabled>Save and pack</button>
        </div>
      </div>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="manifest">manifest</button>
        <button type="button" class="tab" data-tab="layout">layout</button>
        <button type="button" class="tab" data-tab="labels">labels</button>
      </div>
      <textarea id="jsonEditor" spellcheck="false" disabled placeholder="Select a package"></textarea>
    </section>
  </main>

  <pre id="status" class="status" role="status"></pre>

  <script src="/hprp-studio/vendor/jszip.min.js"></script>
  <script src="/hprp-studio/table-layout-engine.js"></script>
  <script src="/hprp-studio/header-layout-engine.js"></script>
  <script src="/hprp-studio/designer-studio.js"></script>
  <script src="/hprp-studio/studio.js"></script>
</body>
</html>
