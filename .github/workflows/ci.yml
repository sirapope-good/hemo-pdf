name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Hemo.Pdf.sln

      - name: Build
        run: dotnet build Hemo.Pdf.sln --no-restore -c Release

      - name: Test
        run: dotnet test Hemo.Pdf.sln --no-build -c Release --verbosity normal
