services:
  hemo-pdf-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5090:5090"
    # Reach Web.Api on the host (container localhost ≠ host localhost).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HemoPdf__UseMockServices: "true"
      HemoPdf__UseServerFetch: "true"
      HemoPdf__WebApi__BaseUrl: "http://host.docker.internal:8200"
      HemoPdf__BrandingRootPath: "/app/assets/branding"
      # Content is published under /app/assets; "../../assets/templates" resolves outside the image.
      HemoPdf__TemplatesRootPath: "/app/assets/templates"
      HemoPdf__PackagesRootPath: "/app/packages"
      HemoPdf__PackagesWritePath: "/app/packages"
      HemoPdf__EnableHprpStudioWrite: "true"
      HemoPdf__CorsOrigins__0: "http://localhost:4200"
      HemoPdf__CorsOrigins__1: "http://localhost:4500"
      HemoPdf__CorsOrigins__2: "http://127.0.0.1:4200"
      HemoPdf__CorsOrigins__3: "http://127.0.0.1:4500"
      HemoPdf__CorsOrigins__4: "http://localhost:5000"
      HemoPdf__CorsOrigins__5: "http://localhost:5090"
      HemoPdf__CorsOrigins__6: "http://127.0.0.1:5090"
    volumes:
      - ./assets/branding:/app/assets/branding
      - ./assets/templates:/app/assets/templates:ro
      - ./packages:/app/packages
      # Live Studio JS/CSS without rebuild (parity fixes land immediately).
      - ./src/Hemo.Pdf.Api/wwwroot:/app/wwwroot
