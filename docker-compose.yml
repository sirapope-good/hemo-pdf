services:
  hemo-pdf-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5090:5090"
    # Reach Web.Api on the host (container localhost ≠ host localhost).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HemoPdf__UseMockServices: "true"
      HemoPdf__UseServerFetch: "true"
      HemoPdf__WebApi__BaseUrl: "http://host.docker.internal:8200"
      HemoPdf__BrandingRootPath: "/app/assets/branding"
      # Content is published under /app/assets; "../../assets/templates" resolves outside the image.
      HemoPdf__TemplatesRootPath: "/app/assets/templates"
    volumes:
      - ./assets/branding:/app/assets/branding:ro
      - ./assets/templates:/app/assets/templates:ro
